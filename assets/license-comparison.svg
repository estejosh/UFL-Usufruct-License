<svg width="1200" height="1138" viewBox="0 0 1200 1138" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison of source-available license types">
<rect width="1200" height="1138" fill="#0d1117"/>
<text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e6edf3">UFL vs. other source-available licenses</text>
<text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e">What each license leaves free to do — and the one thing it gates</text>
<text x="60" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6e7681">LICENSE</text>
<circle cx="260" cy="123" r="5" fill="#3fb950"/>
<text x="285" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#3fb950">FREE</text>
<circle cx="700" cy="123" r="5" fill="#d29922"/>
<text x="725" y="128" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#d29922">GATED</text>
<line x1="40" y1="148" x2="1160" y2="148" stroke="#30363d" stroke-width="1"/>
<rect x="0" y="168" width="1200" height="130" fill="#12181f"/>
<text x="60" y="214" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">MIT / Apache 2.0</text>
<circle cx="260" cy="202" r="5" fill="#3fb950"/>
<text x="285" y="206" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Everything</text>
<circle cx="700" cy="202" r="5" fill="#d29922"/>
<text x="725" y="206" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Nothing — fully open</text>
<line x1="40" y1="298" x2="1160" y2="298" stroke="#30363d" stroke-width="1"/>
<rect x="0" y="298" width="1200" height="130" fill="#0d1117"/>
<text x="60" y="344" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">BUSL 1.1</text>
<circle cx="260" cy="332" r="5" fill="#3fb950"/>
<text x="285" y="336" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Use up to an Additional Use Grant</text>
<circle cx="700" cy="332" r="5" fill="#d29922"/>
<text x="725" y="336" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Production use beyond the grant, until a</text>
<text x="725" y="358" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">future Change Date converts the whole</text>
<text x="725" y="380" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">license to Apache/MIT</text>
<line x1="40" y1="428" x2="1160" y2="428" stroke="#30363d" stroke-width="1"/>
<rect x="0" y="428" width="1200" height="130" fill="#12181f"/>
<text x="60" y="474" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">SSPL</text>
<circle cx="260" cy="462" r="5" fill="#3fb950"/>
<text x="285" y="466" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Use and modification</text>
<circle cx="700" cy="462" r="5" fill="#d29922"/>
<text x="725" y="466" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Offering it as a service — triggers an</text>
<text x="725" y="488" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">obligation to open-source your entire</text>
<text x="725" y="510" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">service stack</text>
<line x1="40" y1="558" x2="1160" y2="558" stroke="#30363d" stroke-width="1"/>
<rect x="0" y="558" width="1200" height="130" fill="#0d1117"/>
<text x="60" y="604" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Elastic License 2.0</text>
<circle cx="260" cy="592" r="5" fill="#3fb950"/>
<text x="285" y="596" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Use, modification, redistribution</text>
<circle cx="700" cy="592" r="5" fill="#d29922"/>
<text x="725" y="596" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Offering it as a hosted/managed service</text>
<text x="725" y="618" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">to third parties</text>
<line x1="40" y1="688" x2="1160" y2="688" stroke="#30363d" stroke-width="1"/>
<rect x="0" y="688" width="1200" height="130" fill="#12181f"/>
<text x="60" y="734" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">Fair Source (FSL)</text>
<circle cx="260" cy="722" r="5" fill="#3fb950"/>
<text x="285" y="726" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Use, including production, for a</text>
<text x="285" y="748" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">defined period</text>
<circle cx="700" cy="722" r="5" fill="#d29922"/>
<text x="725" y="726" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Competing by offering it as a hosted</text>
<text x="725" y="748" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">alternative; converts to Apache/MIT</text>
<text x="725" y="770" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">after ~2 years</text>
<line x1="40" y1="818" x2="1160" y2="818" stroke="#30363d" stroke-width="1"/>
<rect x="0" y="818" width="1200" height="130" fill="#0d1117"/>
<text x="60" y="864" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3">PolyForm Shield</text>
<circle cx="260" cy="852" r="5" fill="#3fb950"/>
<text x="285" y="856" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Use, including commercial</text>
<circle cx="700" cy="852" r="5" fill="#d29922"/>
<text x="725" y="856" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Using it to build a product that</text>
<text x="725" y="878" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">competes with the licensor</text>
<line x1="40" y1="948" x2="1160" y2="948" stroke="#30363d" stroke-width="1"/>
<rect x="0" y="948" width="1200" height="130" fill="#10241a"/>
<rect x="0" y="948" width="6" height="130" fill="#3fb950"/>
<text x="60" y="994" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#3fb950">UFL 1.0</text>
<text x="60" y="1016" font-family="Menlo, Consolas, monospace" font-size="12" fill="#6e7681">this repo →</text>
<circle cx="260" cy="982" r="5" fill="#3fb950"/>
<text x="285" y="986" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Use, at any scale, including</text>
<text x="285" y="1008" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">commercial — unconditionally</text>
<circle cx="700" cy="982" r="5" fill="#d29922"/>
<text x="725" y="986" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Redistributing the software itself,</text>
<text x="725" y="1008" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">modified or not, to third parties</text>
<line x1="40" y1="1094" x2="1160" y2="1094" stroke="#30363d" stroke-width="1"/>
<text x="40" y="1114" font-family="Menlo, Consolas, monospace" font-size="13" fill="#6e7681">github.com/estejosh/UFL-Usufruct-License</text>
<text x="1160" y="1114" font-family="Menlo, Consolas, monospace" font-size="13" fill="#58a6ff" text-anchor="end">Source: WHITEPAPER.md</text>
</svg>
